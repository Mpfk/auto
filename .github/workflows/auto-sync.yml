name: Auto Framework Sync

on:
  schedule:
    - cron: '0 9 * * 1'   # Weekly, Monday 09:00 UTC
  workflow_dispatch:        # Manual trigger from Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Use the opt-in AUTO_SYNC_TOKEN when present (a fine-grained PAT with
      # contents+workflows write, scoped to this repo) so .github/workflows/**
      # can be pushed; otherwise fall back to the default GITHUB_TOKEN, which is
      # NOT permitted to create/update workflow files.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTO_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Run auto-sync
        id: sync
        env:
          AUTO_SYNC_TOKEN: ${{ secrets.AUTO_SYNC_TOKEN }}
        run: |
          chmod +x bin/auto-sync
          bin/auto-sync --skip-verify
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "excluded_workflows=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # Default path (no opt-in token): GITHUB_TOKEN cannot push workflow
          # files, so capture any changed .github/workflows/** paths and revert
          # them out of the working tree before they are committed. They are
          # surfaced in the PR body for manual application instead.
          if [ -n "$AUTO_SYNC_TOKEN" ]; then
            echo "excluded_workflows=" >> "$GITHUB_OUTPUT"
          else
            excluded="$(git status --porcelain -- .github/workflows/ | sed 's/^...//')"
            if [ -n "$excluded" ]; then
              # Revert tracked changes under .github/workflows/ ...
              git checkout -- .github/workflows/ 2>/dev/null || true
              # ... and drop any newly-added (untracked) workflow files.
              git clean -fd .github/workflows/ 2>/dev/null || true
            fi
            {
              echo "excluded_workflows<<WF_EOF"
              echo "$excluded"
              echo "WF_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR if changes detected
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTO_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          EXCLUDED_WORKFLOWS: ${{ steps.sync.outputs.excluded_workflows }}
        run: |
          VERSION=$(cat .auto-version)
          BRANCH="auto-sync/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          # Nothing left to commit if the only changes were excluded workflow files.
          if git diff --cached --quiet; then
            echo "Only excluded workflow files changed; nothing to push."
            exit 0
          fi
          git commit -m "chore: sync Auto framework to v${VERSION}"
          git push origin "$BRANCH"
          sed 's/^ *//' > /tmp/pr-body.md <<EOF
            Automated framework sync from [Mpfk/auto](https://github.com/Mpfk/auto) v${VERSION}.

            Review the diff carefully before merging — this updates framework files.
            Your config (\`workflow.conf\`, \`.claude/settings.json\`) and consumer hooks (\`1xx-\` scripts) are untouched per \`.autosyncignore\`.

            See [\`docs/auto/template-propagation.md\`](docs/auto/template-propagation.md) for the ownership model.
          EOF
          if [ -n "$EXCLUDED_WORKFLOWS" ]; then
            {
              echo ""
              echo "## ⚠️ Workflow files changed upstream — apply manually"
              echo ""
              echo "The default \`GITHUB_TOKEN\` cannot push to \`.github/workflows/**\`, so the"
              echo "following workflow file(s) were **excluded** from this PR. Copy them manually"
              echo "from [Mpfk/auto](https://github.com/Mpfk/auto) at v${VERSION}, or configure the"
              echo "optional \`AUTO_SYNC_TOKEN\` secret (see \`docs/auto/template-propagation.md\`) so"
              echo "future syncs include them automatically:"
              echo ""
              while IFS= read -r wf; do
                [ -n "$wf" ] && echo "- \`$wf\`"
              done <<< "$EXCLUDED_WORKFLOWS"
            } >> /tmp/pr-body.md
          fi
          gh pr create \
            --title "chore: sync Auto framework to v${VERSION}" \
            --body-file /tmp/pr-body.md \
            --label "chore"
