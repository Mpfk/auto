name: PR Checks
# Thin caller. The real CI logic lives in reusable-pr-checks.yml so it can be
# shared with consumer repos via `uses: Mpfk/auto/.github/workflows/reusable-pr-checks.yml@v1`.
# This repo dogfoods the exact pattern with a local `./` reference.
#
# The workflow name ("PR Checks") is load-bearing: ci-issue-gate.yml triggers on
# `workflow_run` for it. Keep it stable.
on:
  pull_request:
    branches: [main]

jobs:
  checks:
    uses: ./.github/workflows/reusable-pr-checks.yml
    permissions:
      contents: read
      issues: read
      pull-requests: read
